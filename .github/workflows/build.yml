name: Compile Heltec V4 Blink

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Arduino CLI instellen
        uses: arduino/setup-arduino-cli@v2

      - name: Heltec ESP32 Core installeren
        run: |
          arduino-cli core update-index --additional-urls https://github.com/Heltec-Aaron-Lee/WiFi_Kit_series/releases/download/0.0.9/package_heltec_esp32_index.json
          arduino-cli core install Heltec-esp32:esp32 --additional-urls https://github.com/Heltec-Aaron-Lee/WiFi_Kit_series/releases/download/0.0.9/package_heltec_esp32_index.json

      - name: CHECK - Welke boards zijn er werkelijk?
        run: arduino-cli board listall heltec

      - name: Sketch compileren (Heltec V4)
        run: |
          arduino-cli compile --fqbn Heltec-esp32:esp32:heltec_wifi_lora_32_V3 ./Blink_Serial

      - name: Bewaar het .bin bestand als Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blink-firmware
          path: |
            ./Blink_Serial/**/*.bin
            ./Blink_Serial/*.bin
