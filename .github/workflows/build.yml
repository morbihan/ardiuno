name: Compile Heltec V4 Blink

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Arduino CLI instellen
        uses: arduino/setup-arduino-cli@v2

      - name: Heltec Core installeren
        run: |
          arduino-cli core update-index --additional-urls https://github.com/Heltec-Aaron-Lee/WiFi_Kit_series/releases/download/0.0.9/package_heltec_esp32_index.json
          arduino-cli core install Heltec-esp32:esp32 --additional-urls https://github.com/Heltec-Aaron-Lee/WiFi_Kit_series/releases/download/0.0.9/package_heltec_esp32_index.json

      - name: Sketch compileren & Binair exporteren
        run: |
          arduino-cli compile --fqbn Heltec-esp32:esp32:WIFI_LoRa_32_V3 --export-binaries --additional-urls https://github.com/Heltec-Aaron-Lee/WiFi_Kit_series/releases/download/0.0.9/package_heltec_esp32_index.json ./Blink_Serial

      - name: Bestanden samenvoegen tot één firmware
        run: |
          ESPTOOL_PATH=$(find ~/.arduino15/packages/Heltec-esp32 -name "esptool.py" | head -n 1)
          python3 "$ESPTOOL_PATH" --chip esp32s3 merge_bin \
            --output ./Blink_Serial/firmware-merged.bin \
            0x1000 ./Blink_Serial/Blink_Serial.ino.bootloader.bin \
            0x8000 ./Blink_Serial/Blink_Serial.ino.partitions.bin \
            0x10000 ./Blink_Serial/Blink_Serial.ino.bin

      - name: Bewaar het .bin bestand als Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blink-firmware
          path: ./Blink_Serial/**/*.bin
