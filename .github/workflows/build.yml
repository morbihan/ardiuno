name: Compile Heltec V4 Blink

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Arduino CLI instellen
        uses: arduino/setup-arduino-cli@v2

      - name: Heltec Core installeren en Sketch compileren
        run: |
          arduino-cli core update-index --additional-urls https://github.com/Heltec-Aaron-Lee/WiFi_Kit_series/releases/download/0.0.9/package_heltec_esp32_index.json
          arduino-cli core install Heltec-esp32:esp32 --additional-urls https://github.com/Heltec-Aaron-Lee/WiFi_Kit_series/releases/download/0.0.9/package_heltec_esp32_index.json
          mkdir -p build
          arduino-cli compile --fqbn Heltec-esp32:esp32:WIFI_LoLa_32_V3 --output-dir ./build --additional-urls https://github.com/Heltec-Aaron-Lee/WiFi_Kit_series/releases/download/0.0.9/package_heltec_esp32_index.json ./Blink_Serial

      - name: Bewaar het .bin bestand als Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blink-firmware
          path: ./build/*.bin
